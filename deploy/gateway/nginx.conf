# S0 只开放管理页面与管理 API；宿主端口由 Compose 绑定到 loopback。
worker_processes 1;
pid /tmp/nginx.pid;
# nginx 原生错误日志可能包含来源 IP 与请求 URL，关闭该输出；用状态日志与后端 request ID 排障。
error_log /dev/null crit;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;
    log_format safe_json escape=json
        '{"event":"gateway_request","request_id":"$request_id",'
        '"status":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe_json;
    include /etc/nginx/mime.types;

    upstream admin_backend {
        zone admin_backend 64k;
        # 容器重建会改变地址；仅向 Docker 内置 DNS 重新解析固定服务名。
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server api-admin:8000 resolve;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        default_type application/json;

        location ^~ /manage/assets/ {
            try_files $uri =404;
        }

        location /manage/ {
            try_files $uri $uri/ /manage/index.html;
        }

        location /api/v1/admin/ {
            proxy_pass http://admin_backend;
            proxy_set_header Host $http_host;
            # 来源只信任本次 TCP 对端，禁止把客户端伪造的链追加进来。
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP "";
        }

        location / {
            return 404 '{"error":{"code":"NOT_FOUND"}}';
        }
    }
}
